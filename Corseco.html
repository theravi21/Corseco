function shell(){const nav=[['dashboard','grid','Dashboard'],['applications','box','Applications'],['documents','file','Documents'],['transport','ship','Transport'],['inbox','message','Inbox']];$('#sidebar').innerHTML=`<a href="#dashboard" class="brand" aria-label="Corseco dashboard"><span></span>corseco</a><div class="workspace"><div class="workspace-logo">CS</div><div><strong>Corseco Shipping Agency</strong><small>Kuwait workspace</small></div></div><p class="nav-label">WORKSPACE</p><nav>${nav.map(([key,i,label])=>`<button data-page="${key}" class="${state.page===key||state.page==='detail'&&key==='applications'?'active':''}">${icon(i)}${label}${key==='applications'?`<span class="nav-count">${active().length}</span>`:key==='inbox'?`<span class="nav-count">${state.messages.length}</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><p class="demo-note">SHIPPING AGENT PORTAL<br>One workspace. Every shipment.</p><div class="profile"><span class="avatar">FA</span><div><strong>Fatima Al-Rashidi</strong><small>Shipping agent</small></div></div></div>`;$('#topbar').innerHTML=`<div class="breadcrumbs">${btn(icon('menu'),'menu','icon-button menu-toggle','aria-label="Open navigation"')}<span>Workspace</span><span>/</span><strong>${state.page==='detail'?'Applications':({dashboard:'Shipping Agent Dashboard',applications:'Applications',documents:'Documents',transport:'Transport',inbox:'Inbox'})[state.page]}</strong>${state.selected?`<span>/ ${esc(state.selected)}</span>`:''}</div><div class="top-right"><span class="top-date">Thursday, 09 January 2025</span><span class="demo-pill">DEMO WORKSPACE</span>${btn(icon('bell'),'notices','icon-button notification','aria-label="Operational notices"')}<span class="avatar" style="background:#eef2fb;color:#536b90">FA</span></div>`}

function context(s){return `<div class="context-stack">${card('Application details',`<div class="context-body"><div class="context-row"><label>BUYER / IMPORTER</label><strong>${esc(s.buyer)}</strong><small>Kuwait</small></div><div class="context-row"><label>SELLER / EXPORTER</label><strong>${esc(s.seller)}</strong><small>${esc(s.from)} · ${s.route}</small></div><div class="context-row"><label>CARGO</label><strong>${esc(s.category)}</strong></div><div class="context-row"><label>INVOICE VALUE</label><strong>${esc(s.value)}</strong></div><div class="context-row"><label>SHIPPING AGENT</label><strong>${s.broker=== ''?'Awaiting assignment':'Corseco Shipping Agency, Kuwait'}</strong></div></div>`,'','context-card')}${card('Source documents',`<div class="document-mini"><span class="file-icon">${icon('file')}</span><div><strong>Commercial invoice</strong><small>CI · v${s.id===seed[0].id?state.ciVersion:1} · Pages 1–2</small></div>${btn(icon('eye'),'source','icon-button','aria-label="View commercial invoice" data-source="CI"')}</div><div class="document-mini"><span class="file-icon">${icon('file')}</span><div><strong>Packing list</strong><small>PL · v1 · Pages 3–4</small></div>${btn(icon('eye'),'source','icon-button','aria-label="View packing list" data-source="PL"')}</div>`,'','context-card')}${card('Need something from the buyer?',`<div class="context-body"><p>Keep questions attached to this application so the buyer has the right context.</p><div class="section-gap">${btn(icon('message')+' Message buyer','message','full-width')}</div></div>`,'','context-card')}</div>`}
function focus(title,desc,type=''){return `<div class="focus-banner ${type}">${icon(type==='success'?'check':type==='info'?'people':'alert')}<div><strong>${title}</strong><p>${desc}</p></div></div>`}
function detail(){const s=current();if(!s)return '<div class="empty">Application not found.</div>';const stage=state.viewStage??s.stage;return `<button class="link-button back" data-page="applications">${icon('back')} All applications</button>`+heading(`${s.id} <span class="muted" style="font-weight:400">/</span> ${esc(s.buyer)}`,`${esc(s.category)} &nbsp; · &nbsp; ${esc(s.from)} → Shuwaikh, Kuwait`,`${badge(s.delivered?'Delivered':stages[s.stage],s.delivered?'green':'blue')}<span class="owner-chip"><span class="avatar">FA</span>Fatima Al-Rashidi</span>`).replace('class="page-title"','class="page-title detail-title"')+`<div class="stagebar" aria-label="Application stages">${stages.map((name,i)=>`<button class="stage-tab ${i<s.stage||s.delivered?'complete':''} ${i===stage?'current':''}" data-viewstage="${i}" ${i>s.stage?'disabled':''}><span class="stage-number">${i<s.stage||s.delivered?'✓':i+1}</span>${name}</button>`).join('')}</div><div class="detail-grid"><section>${stage<s.stage?completedStage(s,stage):[applicationReview,consistency,buyerTagging,supportingDocs,handover,tracking][stage](s)}</section>${context(s)}</div>`}
function previewTable(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function reviewedItems(s){if(s.id===seed[0].id)return state.lines.map(l=>({name:l.name,hs:l.hs,qty:l.ci,packing:l.qty,box:l.box,weight:l.weight+' kg',rate:'$'+l.value,original:l.original}));if(s.id==='SHP-KW-2404')return [{name:'Patient monitors',hs:'9018.19.00',qty:40,packing:40,box:'01–08',weight:'480 kg',rate:'KD 1,600'},{name:'Infusion pumps',hs:'9018.90.50',qty:60,packing:60,box:'09–16',weight:'360 kg',rate:'KD 900'},{name:'Diagnostic reagents',hs:'3822.00.00',qty:150,packing:150,box:'17–24',weight:'400 kg',rate:'KD 64'}];return [{name:s.category,hs:'Not included in sample',qty:'—',packing:'—',box:'—',weight:'—',rate:'—'}]}
function completedStage(s,stage){const items=reviewedItems(s),origin=s.origin||({'DE':'Germany','CN':'China','TR':'Türkiye','JP':'Japan','ES':'Spain','NL':'Netherlands'})[s.route.slice(0,2)],known=s.id===seed[0].id||s.id==='SHP-KW-2404';const fields=pairs=>`<div class="card-body field-grid">${pairs.map(([k,v])=>`<div class="context-row"><label>${esc(k)}</label><strong>${esc(v||'Not included in sample')}</strong></div>`).join('')}</div>`;let body='';
if(stage===0){body=card('Confirmed application details',fields([['Buyer / consignee',s.buyer],['Seller / shipper',s.seller],['Country of origin',origin],['Invoice number',s.invoice],['Port of loading',s.from],['Port of discharge',s.destination||'Shuwaikh, Kuwait'],['Incoterms',s.terms],['Invoice value',s.value],['Assigned shipping agent',s.broker||'Corseco Shipping Agency, Kuwait'],['Assignment',s.invoice?'Confirmed during extraction review':'Confirmed · sample record']]),badge('Verified','green'))+card('Uploaded anchor documents',`<div class="checklist">${['CI','PL'].map(t=>`<div class="check-row"><span class="file-icon">${icon('file')}</span><div><strong>${t==='CI'?'Commercial invoice':'Packing list'}</strong><p>Version ${t==='CI'&&s.id===seed[0].id?state.ciVersion:1} · Extraction reviewed</p></div>${btn(icon('eye')+' Preview','source','',`data-source="${t}"`)}</div>`).join('')}</div>`,'','section-gap');}
if(stage===1){body=`<div class="review-stats"><div class="review-stat"><b class="green">${known?items.length:'—'}</b><span>Lines aligned</span></div><div class="review-stat"><b>0</b><span>Unresolved differences</span></div><div class="review-stat"><b>0</b><span>Unlinked lines</span></div></div>`+card('Approved CI / PL comparison',previewTable(['Item / HS code','Invoice qty','Packing qty','Rate','Package / net weight','Result'],items.map(l=>[`<strong>${esc(l.name)}</strong><small>${esc(l.hs)}</small>`,esc(l.qty),esc(l.packing),esc(l.rate),`${esc(l.box)}<small>${esc(l.weight)}</small>`,badge(known?'Aligned':'Review recorded','green')]))+`<div class="card-body"><p class="hint">${known?'Every listed item is linked to its packing entry. Rates come from the invoice; packing weights come from the packing list.':'The review is complete in this sample; detailed source line values were not supplied.'}</p><div class="actions section-gap">${btn('Preview invoice','source','','data-source="CI"')}${btn('Preview packing list','source','','data-source="PL"')}</div></div>`,badge('Approved','green'))+card('Review history',`<div class="card-body">${items.filter(l=>l.original).map(l=>`<p class="hint">CI v1: ${esc(l.original.name)} · quantity ${l.original.ci}. Corrected CI v2: ${esc(l.name)} · quantity ${l.qty}.</p>`).join('')||`<p class="hint">${esc(s.initialReviewNote||'CI / PL review completed · sample approval record.')}</p>`}<p class="hint">Shipping agent review complete. Application released to buyer tagging.</p></div>`,'','section-gap');}
if(stage===2){body=card('Buyer-confirmed product tagging',previewTable(['Product','HS classification','Quantity','Package mapping','Confirmation'],items.map(l=>[esc(l.name),esc(l.hs),esc(l.qty),esc(l.box),badge('Buyer confirmed','green')]))+`<div class="card-body"><p class="hint">Confirmed by ${esc(s.buyer)}${s.tagConfirmed?' · buyer response recorded this session':' · sample completed record'}. The shipping agent assists; the buyer owns these decisions.</p></div>`,badge('Confirmed','green'))+card('Document requirements after tagging',`<div class="checklist">${[['Certificate of origin','Origin and shared goods information'],['Certificate of conformity','Product and destination applicability review']].map(([a,b])=>`<div class="check-row"><span class="check-circle done">✓</span><div><strong>${a}</strong><p>${b}</p></div>${badge('Identified','green')}</div>`).join('')}</div><div class="card-body"><p class="hint">Destination: Kuwait · Cargo: ${esc(s.category)}. These are the prototype’s example requirements, not a live regulatory determination.</p></div>`,'','section-gap');}
if(stage===3){body=card('Reviewed supporting documents',`<div class="checklist">${['Certificate of origin','Certificate of conformity'].map((name,i)=>`<div class="check-row"><span class="file-icon">${icon('file')}</span><div><strong>${name}</strong><p>${i===0?'Origin and shipment details checked':'Scope, issuer and applicability checked'}</p></div>${badge('Approved','green')}${btn('Preview','completed-document','',`data-document="${i}"`)}</div>`).join('')}</div>`)+card('Completed compliance checks',previewTable(['Check','Reviewed value / evidence','Result'],[['Parties',esc(s.seller)+' → '+esc(s.buyer),badge('Reviewed','green')],['Goods',esc(s.category),badge('Reviewed','green')],['Origin declaration',esc(origin),badge('Reviewed','green')],['Certificate of origin',esc(s.docEvidence?.[0]||'Shared fields and origin reviewed · sample record'),badge('Approved','green')],['Certificate of conformity',esc(s.docEvidence?.[1]||'Scope and destination applicability reviewed · sample record'),badge('Approved','green')]]),'','section-gap')+`<p class="hint">The Bill of Lading is checked separately when issued during shipment tracking${s.blReviewed?'; its review is also complete for this shipment.':'.'}</p>`;}
if(stage===4){body=card('Confirmed origin handover',fields([['Principal agent',s.principal||s.from+' origin operations'],['Origin',s.from],['Receipt date',s.receivedDate?date(s.receivedDate):s.id==='SHP-KW-2404'?'17 Dec 2024':'Not included in sample'],['Confirmation reference',s.handoverRef],['Document set','Receipt confirmed'],['Goods','Receipt and condition confirmed']]),badge('Received','green'))+card('Completed handover checklist',`<div class="checklist">${['CI / PL consistency approved','Buyer tagging confirmed','Required supporting documents approved','Document receipt confirmed by principal agent','Goods receipt confirmed by principal agent'].map(t=>`<div class="check-row"><span class="check-circle done">✓</span><strong>${t}</strong></div>`).join('')}</div>`,'','section-gap');}
return focus(`${stages[stage]} completed`,'Review the confirmed details below. This completed stage is read-only.','success')+body+`<div class="stage-footer"><small>${badge('Completed','green')} Read-only review</small>${btn('Return to current stage '+icon('arrow'),'current-stage')}</div>`}

function applicationReview(s){return focus('Confirm the extraction and assign this application','No shipping agent was found in the uploaded documents. Check the required details before making this application available to the agent.')+card('Extracted application details',`<div class="card-body"><form id="assignment-form"><div class="field-grid"><label>Buyer / consignee<input name="buyer" required value="${esc(s.buyer)}"></label><label>Seller / shipper<input name="seller" required value="${esc(s.seller)}"></label><label>Country of origin<input name="origin" required value="China"></label><label>Invoice number<input name="invoice" required placeholder="Check invoice source"></label><label>Port of loading<input name="port" required value="${esc(s.from)}"></label><label>Port of discharge<input name="destination" required value="Shuwaikh, Kuwait"></label><label>Shipping agent<select name="agent" required><option value="">Select an agent</option><option>Corseco Shipping Agency, Kuwait</option></select></label><label>Incoterms<select name="terms"><option>FOB</option><option>CIF</option><option>EXW</option></select></label></div><p class="hint">Source: buyer’s CI / PL upload. Missing values must be verified against the document.</p><div class="form-actions"><button class="primary" type="submit">Confirm & assign ${icon('arrow')}</button></div></form></div>`,btn(icon('eye')+' View source','source','link-button','data-source="CI"'))}
function consistency(s){if(s.id!==seed[0].id)return focus('Review the commercial invoice and packing list','Review required application fields and record your check. This sample has no detailed line comparison.','info')+card('Initial consistency review',`<div class="card-body"><p class="hint">Confirm product descriptions, quantities, HS codes and packing details from the source documents.</p>${btn('Record CI / PL review','generic-review','primary')}</div>`);const lines=state.lines.filter(l=>(state.reviewFilter==='all'||l.status===state.reviewFilter)&&(!state.reviewSearch||`${l.name} ${l.id} ${l.hs}`.toLowerCase().includes(state.reviewSearch.toLowerCase())));const total=blocked();return focus(total?`${total} lines need your attention before buyer tagging`:'All lines are aligned. Ready for buyer tagging.',total?'Resolve the differences or request a corrected document. Link unmatched items to their packing lines.':'All six invoice lines are linked and quantities agree. The buyer will own the next step.',total?'':'success')+`<div class="review-stats"><div class="review-stat"><b class="green">${state.lines.filter(l=>l.status==='matched').length}</b><span>Lines aligned</span></div><div class="review-stat"><b class="red">${state.lines.filter(l=>l.status==='review').length}</b><span>Need a decision</span></div><div class="review-stat"><b class="blue">${state.lines.filter(l=>l.status==='unlinked').length}</b><span>Need linking</span></div></div><section class="card"><div class="card-head"><div><h2>Invoice & packing list consistency</h2><p>CI v${state.ciVersion} · PL v1 &nbsp; • &nbsp; ${state.lines.length} line items</p></div>${btn(icon('refresh')+' Recompute','recompute','link-button')}</div><div class="review-toolbar"><div class="segmented">${[['all','All',state.lines.length],['review','Needs review',state.lines.filter(l=>l.status==='review').length],['unlinked','Unlinked',state.lines.filter(l=>l.status==='unlinked').length],['matched','Aligned',state.lines.filter(l=>l.status==='matched').length]].map(([k,t,n])=>`<button class="${state.reviewFilter===k?'active':''}" data-reviewfilter="${k}">${t} <span>${n}</span></button>`).join('')}</div>${searchInput('Search item or line…','review-search')}</div><div id="line-results">${lineTable(lines)}</div><div class="review-bottom"><p>${state.requested?'Correction request saved in the application conversation.':'Expand a line to see source values and available decisions.'}</p>${btn(icon('message')+' Request buyer correction','request-correction')}</div></section>${state.requested&&!state.corrected?`<div class="source-note">Prototype scenario: ${btn('Load corrected sample invoice','corrected','demo-action')} &nbsp; Simulates the buyer returning CI v2; original values remain in the review history.</div>`:''}<div class="stage-footer"><small>${total?`${total} unresolved lines · Continue is blocked`:'All checks complete · Buyer owns tagging'}</small>${s.stage===1?btn('Send to buyer tagging '+icon('arrow'),'advance-review','primary',total?'disabled':''):badge('Review completed','green')}</div>`}
function lineTable(lines){if(!lines.length)return '<div class="empty">No lines match this filter.</div>';return `<div class="table-wrap"><table class="review-table"><thead><tr><th>Line</th><th>Item description</th><th>Qty · CI / PL</th><th>Differences</th><th>Action</th></tr></thead><tbody>${lines.map(l=>`<tr><td><button class="expand" data-expand="${l.id}" aria-label="${state.expanded===l.id?'Collapse':'Expand'} line ${l.id}">${icon(state.expanded===l.id?'down':'chevron')}</button><span class="small muted">${l.id}</span></td><td class="description"><strong>${l.name}</strong><small>HS ${l.hs}</small></td><td>${l.ci}<span class="${l.ci!==l.qty?'qty-diff':'muted'}"> / ${l.qty}</span></td><td><div class="diff-tags">${l.status==='matched'?badge('Aligned','green'):badge(l.issue,l.status==='unlinked'?'blue':'red')}</div></td><td>${l.status==='unlinked'?`<button class="link-button" data-link="${l.id}">${icon('link')} Link line</button>`:l.status==='review'?`<button class="link-button" data-expand="${l.id}">Review ${icon('arrow')}</button>`:`<span class="small green">✓ Linked</span>`}</td></tr>${state.expanded===l.id?`<tr class="detail-expanded"><td colspan="5"><div class="field-comparison"><div><label>COMMERCIAL INVOICE · PAGE 2, LINE ${l.id}</label><div class="cell-source">${esc(l.name)}<b>Quantity ${l.ci} · Unit rate $${l.value}</b><small>HS ${l.hs}</small></div></div><div><label>PACKING LIST · PAGE 4, LINE ${l.id}</label><div class="cell-source">${esc(l.pl)}<b>Quantity ${l.qty} · Net ${l.weight} kg</b><small>Box ${l.box||'not linked'}</small></div></div><div><label>REVIEW GUIDANCE</label><p>${l.original?`Original CI v1: ${esc(l.original.name)}, quantity ${l.original.ci}. Corrected in v2. `:''}${l.status==='review'?'The source values differ. Request a corrected document from the buyer; do not replace the original evidence.':l.status==='unlinked'?'Confirm the matching packing line before creating a link.':'Descriptions, quantities and classification agree.'}</p></div></div><div class="actions">${btn(icon('eye')+' View source excerpt','source','','data-source="CI" data-line="'+l.id+'"')}${l.status==='review'?btn('Request correction','request-correction','',`data-line="${l.id}"`):''}</div></td></tr>`:''}`).join('')}</tbody></table></div>`}
function buyerTagging(s){return focus('The buyer owns this step. You can help them move forward.','Product tagging and HS classification must be confirmed by the buyer before document requirements are finalized.','info')+card('Buyer progress',`<div class="checklist"><div class="check-row"><span class="check-circle done">✓</span><div><strong>CI / PL consistency complete</strong><p>Commercial and packing data are aligned.</p></div>${badge('Complete','green')}</div><div class="check-row"><span class="check-circle">2</span><div><strong>HS codes & product tagging</strong><p>${s.id==='SHP-KW-2408'?'Buyer asked for help classifying industrial parts.':'Waiting for the buyer to confirm product-specific tags.'}</p></div>${badge('Buyer action','amber')}</div><div class="check-row"><span class="check-circle">3</span><div><strong>Required seller documents</strong><p>Confirmed after buyer tagging and destination review.</p></div>${badge('Pending')}</div></div><div class="card-body"><div class="actions">${btn(icon('message')+' Assist buyer','message','primary')}${btn('Request buyer update','followup')}</div></div>`)+`<div class="stage-footer"><small>Waiting on ${esc(s.buyer)}</small>${badge('Buyer confirmation required','amber')}</div><p class="source-note">Prototype scenario: ${btn('Simulate buyer confirmation','buyer-confirm','demo-action')}</p>`}
function supportingDocs(s){const approved=!!s.docsApproved;return focus(approved?'Supporting documents are ready for handover':'Review supporting documents against CI / PL',approved?'All required documents have a recorded review. You can coordinate origin handover.':'Check shared shipment fields and country-specific requirements. Only request documents relevant to the buyer’s goods.',approved?'success':'')+card('Required documents',`<div class="checklist">${[['Certificate of origin','Origin, exporter, consignee and goods details'],['Certificate of conformity','Product and destination applicability; review basis required']].map(([name,note],i)=>`<div class="check-row"><span class="file-icon">${icon('file')}</span><div><strong>${name}</strong><p>${note}</p></div>${s.docChecks?.[i]?badge('Reviewed','green'):`<button data-checkdoc="${i}">Review ${icon('arrow')}</button>`}</div>`).join('')}<div class="check-row"><span class="file-icon">${icon('file')}</span><div><strong>Bill of Lading</strong><p>Review against CI / PL when issued after loading.</p></div>${badge('Later stage')}</div></div><div class="card-body">${btn(icon('upload')+' Attach document for review','upload')}<p class="hint">Requirements shown are examples, not a configured country rules engine.</p></div>`)+`<div class="stage-footer"><small>${approved?'Required checks recorded':'Both required reviews must be recorded to continue'}</small>${btn('Prepare origin handover '+icon('arrow'),'advance-docs','primary',approved?'':'disabled')}</div>`}
function handover(s){return focus('Documents are ready. Coordinate receipt at origin.','The principal agent must confirm both the document set and the goods before the shipment proceeds.','info')+card('Handover to principal agent',`<div class="card-body"><div class="summary-grid"><div class="summary-box"><small>ORIGIN</small><strong>${esc(s.from)}</strong></div><div class="summary-box"><small>DESTINATION</small><strong>Shuwaikh, Kuwait</strong></div><div class="summary-box"><small>DOCUMENT READINESS</small><strong class="green">Ready for handover</strong></div></div></div><div class="checklist"><div class="check-row"><span class="check-circle done">✓</span><div><strong>Commercial and packing documents</strong><p>Consistency checks completed.</p></div></div><div class="check-row"><span class="check-circle done">✓</span><div><strong>Buyer tagging & required certificates</strong><p>Buyer confirmation and document reviews recorded.</p></div></div><div class="check-row"><span class="check-circle">3</span><div><strong>Goods & document receipt</strong><p>Awaiting confirmation from the principal agent at origin.</p></div></div></div><div class="card-body actions">${btn(icon('message')+' Coordinate with principal agent','principal-message')}${btn('Record receipt confirmation '+icon('arrow'),'record-handover','primary')}</div>`)}
function tracking(s){const eta=s.eta||'2025-01-25';return focus(s.delivered?'Delivered. This journey is complete.':!s.etaPublished?(s.id==='SHP-KW-2404'?'The arrival estimate changed. Update the buyer.':'Share the arrival estimate with the buyer.'):s.cleared?'Customs cleared. Confirm delivery to close the journey.':'Keep the principal agent and buyer aligned.',s.delivered?`Delivery confirmed for ${esc(s.buyer)}. Proof of delivery is recorded in the shipment history.`:!s.etaPublished?`${s.id==='SHP-KW-2404'?'Previous ETA: 20 Jan. ':''}Current estimate: ${date(eta)}. Review the change before recording a buyer update.`:'Record confirmed milestones with their dates and references. The next action is shown below.',s.delivered?'success':s.etaPublished?'info':'')+card('Shipment progress',`<div class="card-body"><div class="summary-grid"><div class="summary-box"><small>CARRIER</small><strong>${s.id==='SHP-KW-2404'?'Hapag-Lloyd':'Assigned carrier'}</strong></div><div class="summary-box"><small>ARRIVAL · ESTIMATE</small><strong>${date(eta)}</strong></div><div class="summary-box"><small>BUYER UPDATE</small><strong>${s.etaPublished?'Recorded':'Awaiting update'}</strong></div></div>${!s.etaPublished?`<div class="section-gap">${btn('Review & update buyer '+icon('arrow'),'eta','primary')}</div>`:''}</div>${[['Origin handover','Goods and documents received by principal agent',true],['Departure',s.departed?(s.departure?date(s.departure):'18 Dec 2024 · Departed origin'):'Awaiting confirmed departure',s.departed,'departure','Record departure'],['Arrival at Shuwaikh',s.arrivalDate?date(s.arrivalDate):'Estimated '+date(eta),s.arrived,'arrival','Record arrival'],['Customs clearance',s.clearanceRef?'Release '+s.clearanceRef:'Confirm clearance and release reference',s.cleared,'clearance','Record clearance'],['Final delivery',s.pod?'POD '+s.pod:'Record recipient and proof of delivery',s.delivered,'delivery','Record delivery']].map(([title,desc,done,act,label],i)=>`<div class="timeline-item"><span class="check-circle ${done?'done':''}">${done?'✓':i+1}</span><div><strong>${title}</strong><p>${esc(desc)}</p></div>${done?badge('Confirmed','green'):((act==='departure'||act==='arrival'&&s.departed||act==='clearance'&&s.arrived||act==='delivery'&&s.cleared)?btn(label,act):badge('Upcoming'))}</div>`).join('')}`)+card('Bill of Lading consistency',`<div class="card-body"><p class="hint">Compare total packages, quantities, gross weight, shipper and consignee with the approved CI / PL.</p><div class="section-gap">${btn(s.blReviewed?'View / review B/L':'Review B/L before clearance','bl-review')}</div></div>`,'','section-gap')}
function documents(){const all=shipments.filter(s=>!state.search||`${s.id} ${esc(s.buyer)}`.toLowerCase().includes(state.search.toLowerCase()));return heading('Document manager','Review documents in their shipment context. Source files stay linked to their application.',btn(icon('upload')+' Add document','global-upload','primary'))+`<div class="filter-line">${searchInput('Search application or buyer…')}</div><div class="card table-wrap" id="document-results"><table class="doc-list"><thead><tr><th>Document set</th><th>Buyer</th><th>Readiness</th><th>Action</th></tr></thead><tbody>${all.map(s=>`<tr><td><strong>${s.id}</strong><small>CI · PL${s.stage>=3?' · Supporting documents':''}</small></td><td>${esc(s.buyer)}</td><td>${badge(s.stage===0?'Extraction review':s.stage===1?'Consistency review':s.stage===3?'Supporting review':'Reviewed',s.stage<2||s.stage===3?'amber':'green')}</td><td><button data-open="${s.id}">Open review ${icon('arrow')}</button></td></tr>`).join('')}${state.uploads.map(u=>`<tr><td><strong>${esc(u.name)}</strong><small>${esc(u.id)}</small></td><td>${esc(u.by)}</td><td>${badge('Manual review required','amber')}</td><td><button data-uploadindex="${state.uploads.indexOf(u)}">View record</button></td></tr>`).join('')}</tbody></table>${!all.length?'<div class="empty">No document sets match your search.</div>':''}</div>`}
function transport(){const list=shipments.filter(s=>s.stage>=4);return heading('Transport coordination','Origin handover, arrival changes and delivery — with a clear next step.')+`<div class="card">${shipmentTable(list,true)}</div>`}
function inbox(){const s=shipments.find(x=>x.id===state.thread)||shipments[1];const threadMessages=state.messages.filter(m=>m.id===s.id);return heading('Application conversations','Keep every request and update attached to its shipment.')+`<section class="card inbox-grid"><div class="inbox-list">${shipments.slice(0,6).map(x=>`<button class="thread ${x.id===s.id?'active':''}" data-thread="${x.id}"><strong>${x.buyer}</strong><small>${x.id} · ${state.messages.filter(m=>m.id===x.id).length} messages</small></button>`).join('')}</div><div class="conversation"><div class="section-gap" style="margin:0 0 25px"><h2>${esc(s.buyer)}</h2><p class="hint">${s.id} · Demo conversation</p></div>${threadMessages.length?threadMessages.map(m=>`<div class="bubble ${m.from==='You'?'sent':''}"><small>${esc(m.from)} → ${esc(m.to)} · ${esc(m.time)}</small>${esc(m.text)}</div>`).join(''):'<div class="empty">No messages yet for this application.</div>'}<div class="actions">${btn(icon('message')+' Compose message','inbox-message','primary')}<button data-open="${s.id}">Open application ${icon('arrow')}</button></div><p class="hint">Messages are saved in this demo only. Nothing is sent externally.</p></div></section>`}
function modal(title,body){$('#dialog-title').textContent=title;$('#dialog-content').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal()}
function close(){ $('#dialog').close() }
function form(title,body,label,handler){modal(title,`<form id="dialog-form">${body}<div class="form-actions">${btn('Cancel','cancel')}<button class="primary" type="submit">${label}</button></div></form>`);$('#dialog-form').onsubmit=e=>{e.preventDefault();handler(new FormData(e.currentTarget))}}
function finish(message){close();render();toast(message)}
function message(s,recipient=null,prefill=''){form('Message '+(recipient||s.buyer),`<p>${s.id} · This message will be recorded in the demo conversation.</p><label>To<select name="to"><option>${esc(recipient||s.buyer)}</option>${!recipient?`<option>${esc(s.from)} principal agent</option><option>${esc(s.seller)}</option>`:''}</select></label><label>Message<textarea name="message" required>${esc(prefill)}</textarea></label>`,'Save demo message',f=>{state.messages.push({id:s.id,to:f.get('to'),from:'You',text:f.get('message'),time:'Just now'});log('Message recorded for '+f.get('to'),s.id);finish('Message saved in Inbox. Nothing sent externally.')})}
function source(type,line){const s=current();if(s&&s.id!==seed[0].id){modal((type==='PL'?'Packing list':'Commercial invoice')+' · source record',`<p>Sample document metadata for ${s.id}. Original PDFs are not included.</p><div class="source-preview"><h3>${type==='PL'?'PACKING LIST':'COMMERCIAL INVOICE'}</h3><p>Seller: ${esc(s.seller)}<br>Buyer: ${esc(s.buyer)}<br>Cargo: ${esc(s.category)}<br>Route: ${esc(s.from)} → Shuwaikh</p></div>`);return}const l=state.lines.find(x=>x.id===Number(line))||state.lines[0];const isCI=type!=='PL';modal((isCI?'Commercial invoice':'Packing list')+' · source excerpt',`<p>Illustrative source excerpt for this prototype. Original PDFs were not provided.</p><div class="source-preview"><h3>${isCI?'COMMERCIAL INVOICE':'PACKING LIST'}</h3><p>${esc(s?.seller||'Shenyang Jihua Boda')}<br>Consignee: ${esc(s?.buyer||'Dsilva General Trading')}</p><table><thead><tr><th>Line</th><th>Description</th><th>Quantity</th><th>${isCI?'Unit rate':'Package'}</th></tr></thead><tbody><tr><td>${l.id}</td><td>${isCI?l.name:l.pl}</td><td><span class="source-mark">${isCI?l.ci:l.qty}</span></td><td>${isCI?'$'+l.value:l.box||'Not linked'}</td></tr></tbody></table><p style="margin-top:18px">${isCI?'Page 2 · CI version '+state.ciVersion:'Page 4 · PL version 1'}</p></div>`)}
function linkLine(id){const l=state.lines.find(x=>x.id===id);form('Link invoice line '+id,`<p>Match <strong>${l.name}</strong> (${l.ci} units) to the corresponding packing line.</p><label>Packing list line<select name="packing" required><option value="">Choose a packing line</option><option value="3">PL line 3 · Nitrile O-ring · 10 units · Box 04</option><option value="4">PL line 4 · Bearing, ceramic · 3 units · Box 05</option></select></label><label class="check"><input type="checkbox" required>I verified the item identity, quantity and package mapping.</label>`,'Confirm link',f=>{if(f.get('packing')!=='3'){toast('That packing line describes a different product and is already linked.');return}l.status='matched';l.identityConfirmed=true;l.issue='';l.box='04';log('Invoice line 3 linked to packing line 3 · Box 04');finish('Line linked. Packing information preserved.')})}
function checkDocument(i){const s=current();const name=i===0?'Certificate of origin':'Certificate of conformity';form('Review '+name,`<p>${s.id} · Compare the certificate with the approved commercial and packing documents.</p><div class="summary-grid"><div class="summary-box"><small>GOODS</small><strong>${esc(s.category)}</strong></div><div class="summary-box"><small>EXPORTER</small><strong>${esc(s.seller)}</strong></div><div class="summary-box"><small>DESTINATION</small><strong>Kuwait</strong></div></div><label class="check"><input name="goods" type="checkbox" required>Goods, quantities and parties agree with the approved CI / PL where stated.</label><label class="check"><input name="valid" type="checkbox" required>${i===0?'Origin declaration and issuer details were checked.':'Product scope, issuer and destination requirements were checked.'}</label><label>Review evidence / applicability basis<textarea name="note" required placeholder="Record the document reference, fields checked and any applicable requirement"></textarea></label>`,'Record document review',f=>{s.docChecks=s.docChecks||[];s.docChecks[i]=true;s.docEvidence=s.docEvidence||[];s.docEvidence[i]=f.get('note');s.docsApproved=!!(s.docChecks[0]&&s.docChecks[1]);log(name+' reviewed: '+f.get('note'));finish('Document review recorded')})}
function upload(s){form('Attach document for review',`<p>Files remain in this browser session. This prototype does not extract or approve uploaded content automatically.</p><label>Application<select name="id">${shipments.map(x=>`<option ${s?.id===x.id?'selected':''}>${x.id}</option>`).join('')}</select></label><label>Document type<select name="type"><option>Commercial invoice</option><option>Packing list</option><option>Certificate of origin</option><option>Certificate of conformity</option><option>Bill of Lading</option></select></label><label>File<input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg" required></label><label>Provided by<input name="by" value="${esc(s?.buyer||'')}" required></label>`,'Attach for manual review',f=>{const file=f.get('file');if(file.size>20*1024*1024){toast('Please select a file under 20 MB.');return}state.uploads.push({id:f.get('id'),name:file.name,type:f.get('type'),by:f.get('by'),file});log(f.get('type')+' attached for manual review',f.get('id'));finish('File attached. Existing source values have not been changed.')})}
function action(name,el){const s=current();switch(name){
case 'menu':document.body.classList.toggle('menu-open');break;
case 'cancel':close();break;
case 'clear-filter':state.filter='all';state.search='';render();break;
case 'delivered-filter':state.filter='completed';render();break;
case 'clear-pipeline':state.pipeline=null;render();break;
case 'current-stage':state.viewStage=null;render();break;
case 'completed-document':{const i=Number(el.dataset.document);modal(i===0?'Certificate of origin · approved':'Certificate of conformity · approved',`<p>Completed review for ${s.id}. Original certificate files are not included in the sample.</p><div class="source-preview"><h3>${i===0?'Certificate of origin':'Certificate of conformity'}</h3><p>Seller: ${esc(s.seller)}<br>Buyer: ${esc(s.buyer)}<br>Goods: ${esc(s.category)}<br>Destination: Kuwait</p>${badge('Approved','green')}<p style="margin-top:16px">${esc(s.docEvidence?.[i]||'Shared shipment information and applicable certificate requirements checked · sample record.')}</p></div>`);break;}
case 'source':source(el?.dataset.source,el?.dataset.line);break;
case 'invite':form('Invite a buyer',`<p>Create an invitation draft. The buyer starts an application and uploads their CI / PL. Email delivery is not connected in this demo.</p><label>Buyer / company name<input name="buyer" required placeholder="Company name"></label><label>Buyer email<input type="email" name="email" required placeholder="buyer@company.com"></label><label>Message<textarea name="text" required>Please start your application and upload the commercial invoice and packing list. We will guide you through the remaining steps.</textarea></label>`,'Create invitation draft',f=>{state.invites.push(Object.fromEntries(f));log('Invitation draft created for '+f.get('buyer'),null);modal('Invitation draft created',`<div class="focus-banner success">${icon('check')}<div><strong>${esc(f.get('buyer'))}</strong><p>${esc(f.get('email'))}</p></div></div><p>${esc(f.get('text'))}</p><p>No email was sent. The draft is available in the activity log during this session.</p>${btn('Done','cancel','primary')}`);shell()});break;
case 'activity':modal('Agency activity',state.history.map(([t,m])=>`<div class="activity-item"><span class="activity-point"></span><div><p>${esc(t)}</p><small>${esc(m)}</small></div></div>`).join('')+(state.invites.length?`<h3 style="margin-top:20px">Invitation drafts</h3>${state.invites.map(v=>`<p>${esc(v.buyer)} · ${esc(v.email)}<br>${esc(v.text)}</p>`).join('')}`:''));break;
case 'notices':modal('Operational notices',`<div class="attention-item"><strong>Arrival revised · SHP-KW-2404</strong><p>The principal agent has revised arrival at Shuwaikh to ${date(shipments[1].eta)}.</p>${btn(state.ack?'Acknowledged':'Acknowledge','ack','',state.ack?'disabled':'')} <button data-open="SHP-KW-2404">Open shipment</button></div><div class="attention-item"><strong>Buyer assistance requested</strong><p>Gulf Engineering needs help with product tagging.</p><button data-open="SHP-KW-2408">Review buyer progress</button></div>`);break;
case 'ack':state.ack=true;log('Arrival notice acknowledged','SHP-KW-2404');close();toast('Notice acknowledged');break;
case 'message':message(s);break;
case 'principal-message':message(s,s.from+' principal agent','The required document reviews are complete. Please confirm receipt of the goods and document set at origin.');break;
case 'inbox-message':message(shipments.find(x=>x.id===state.thread));break;
case 'followup':message(s,s.buyer,'Please confirm your product tagging and HS codes. Let us know which items need assistance so we can help you move to document collection.');break;
case 'request-correction':{const pending=state.lines.filter(l=>l.status==='review');if(!pending.length){toast('There are no source discrepancies requiring correction.');break}const prefill=`Please obtain a corrected commercial invoice from the seller and upload a new revision.\n\n${pending.map(l=>`Line ${l.id} · ${l.name}: invoice quantity ${l.ci}, packing list quantity ${l.qty}${l.name!==l.pl?'; description also differs':''}.`).join('\n')}\n\nOriginal source values will remain in the review history.`;form('Request a corrected document',`<p>${esc(s.buyer)} · ${s.id} · The buyer coordinates corrections with the seller.</p><label>Correction request<textarea name="message" required style="min-height:180px">${esc(prefill)}</textarea></label><label>Response due<input name="due" type="date" required value="2025-01-10" min="2025-01-09"></label>`,'Save request for buyer',f=>{state.requested=true;s.owner='Buyer';s.title='Awaiting corrected invoice';s.note='Correction requested · buyer response pending';s.action='Open review';s.due=date(f.get('due'));state.messages.push({id:s.id,from:'You',to:s.buyer,text:f.get('message'),time:'Just now'});log('Buyer correction request recorded');finish('Correction request recorded. Simulate a buyer response below to continue.')});break}
case 'corrected':{state.corrected=true;state.ciVersion=2;state.lines.filter(l=>l.status==='review').forEach(l=>{l.original={name:l.name,ci:l.ci};l.ci=l.qty;l.name=l.pl;l.status='matched';l.issue=''});s.owner='You';s.title=blocked()?'Link remaining packing line':'Ready for buyer tagging';s.note='Corrected CI v2 received · source history retained';s.action='Continue review';log('Demo CI v2 loaded; original line 1 quantity 7 and line 2 quantity 15 retained in history');finish('Corrected sample applied. Link the remaining packing line.');break}
case 'recompute':{state.lines.forEach(l=>{if(l.status!=='unlinked')l.status=l.ci===l.qty&&(l.name===l.pl||l.identityConfirmed)?'matched':'review'});log('Consistency recomputed from sample source values');render();toast(`${blocked()} unresolved lines. Uploaded files require manual review.`);break}
case 'advance-review':if(blocked()){toast('Resolve all mismatches and unlinked lines before continuing.');break}s.stage=2;s.owner='Buyer';s.kind='tagging';s.title='Waiting for buyer tagging';s.note='CI / PL aligned · buyer confirmation needed';s.action='View buyer progress';s.urgency=4;state.viewStage=null;log('CI / PL approved; application moved to buyer tagging');render();toast('Ready for the buyer to confirm tagging.');break;
case 'generic-review':form('Record initial consistency review','<label class="check"><input type="checkbox" required>I checked invoice and packing-list fields and line mappings.</label><label>Review evidence<textarea name="note" required></textarea></label>','Complete review',f=>{s.stage=2;s.owner='Buyer';s.title='Waiting for buyer tagging';s.note='CI / PL review recorded';s.action='View buyer progress';s.initialReviewNote=f.get('note');log('Initial review recorded: '+f.get('note'));state.viewStage=null;finish('Application moved to buyer tagging')});break;
case 'buyer-confirm':s.tagConfirmed=true;s.stage=3;s.owner='You';s.title='Review supporting documents';s.note='Buyer confirmed tags · documents received';s.action='Review documents';state.viewStage=null;log('Simulated buyer confirmation received; supporting documents available');render();toast('Demo buyer response received. Review the supporting documents.');break;
case 'upload':upload(s);break;
case 'global-upload':upload(null);break;
case 'advance-docs':if(!s.docsApproved){toast('Complete both required document reviews first.');break}s.stage=4;s.owner='You';s.title='Confirm origin handover';s.note='Documents approved · principal agent confirmation needed';s.action='Prepare handover';state.viewStage=null;log('Supporting document reviews complete; handover ready');render();break;
case 'record-handover':form('Record principal agent confirmation',`<p>${esc(s.from)} → Shuwaikh · Confirm receipt of goods and documents. Departure will be recorded separately in transport tracking.</p><label>Principal agent / contact<input name="agent" required placeholder="Agent name and contact"></label><label>Receipt date<input name="received" type="date" required value="2025-01-09"></label><label class="check"><input type="checkbox" required>Principal agent confirmed receipt of the document set.</label><label class="check"><input type="checkbox" required>Principal agent confirmed receipt and condition of the goods.</label><label>Estimated arrival<input name="eta" type="date" required value="2025-01-25"></label><label>Confirmation reference<input name="reference" required placeholder="Receipt / handover reference"></label>`,'Confirm origin handover',f=>{if(f.get('eta')<f.get('received')){toast('Estimated arrival cannot precede origin receipt.');return}s.stage=5;s.receivedDate=f.get('received');s.handoverRef=f.get('reference');s.departed=false;s.eta=f.get('eta');s.etaPublished=false;s.kind='tracking';s.title='Confirm departure from origin';s.note='Principal agent confirmed origin handover';s.action='Open tracking';s.principal=f.get('agent');log('Origin receipt confirmed · '+f.get('reference'));state.viewStage=null;finish('Shipment moved to transport tracking')});break;
case 'eta':form('Review arrival change & update buyer',`<p>${s.id} · Principal agent estimate. The buyer update will be recorded in this demo only.</p><label>Revised estimated arrival<input name="eta" type="date" required value="${s.eta}" min="${s.departure||'2024-12-18'}"></label><label>Update for ${esc(s.buyer)}<textarea name="note" required>The vessel schedule has changed. Arrival at Shuwaikh is now expected on ${date(s.eta)}. We are coordinating destination arrangements with the principal agent.</textarea></label>`,'Record buyer update',f=>{s.eta=f.get('eta');s.etaPublished=true;s.title='Track arrival and clearance';s.note='Buyer update recorded · principal agent coordinating';s.action='Open tracking';s.urgency=6;s.due=date(s.eta);state.messages.push({id:s.id,to:s.buyer,from:'You',text:f.get('note'),time:'Just now'});log('Revised ETA '+date(s.eta)+' recorded for buyer');finish('ETA updated and demo buyer message recorded')});break;
case 'departure':form('Record departure',`<label>Actual departure date<input name="date" type="date" required min="${s.receivedDate||'2025-01-09'}" value="${s.receivedDate||'2025-01-09'}"></label><label>Carrier / voyage reference<input name="reference" required></label>`,'Confirm departure',f=>{s.departed=true;s.departure=f.get('date');s.title='Track arrival and clearance';s.note='Departed origin · carrier '+f.get('reference');log('Departure confirmed on '+date(s.departure));finish('Departure recorded')});break;
case 'arrival':form('Record arrival at destination',`<label>Actual arrival date<input type="date" name="date" required min="${s.departure||'2024-12-18'}" value="${s.eta}"></label><label>Arrival reference<input name="reference" required placeholder="Carrier or port arrival confirmation"></label>`,'Confirm arrival',f=>{s.arrived=true;s.arrivalDate=f.get('date');s.title='Coordinate customs clearance';s.note='Goods arrived · customs release pending';s.action='Record clearance';log('Arrival confirmed on '+date(s.arrivalDate)+' · '+f.get('reference'));finish('Arrival recorded. Customs clearance is next.')});break;
case 'clearance':if(!s.blReviewed){toast('Record the Bill of Lading consistency review before clearance.');break}if(!s.arrived){toast('Confirm arrival before customs clearance.');break}form('Record customs clearance',`<label>Clearance date<input type="date" name="date" required min="${s.arrivalDate||s.eta}" value="${s.arrivalDate||s.eta}"></label><label>Customs release reference<input name="reference" required placeholder="Release reference"></label><label class="check"><input type="checkbox" required>The release is confirmed and goods can move to final transport.</label>`,'Record clearance',f=>{s.cleared=true;s.clearanceDate=f.get('date');s.clearanceRef=f.get('reference');s.title='Confirm final delivery';s.note='Customs cleared · arrange onward transport';s.action='Record delivery';log('Customs cleared · '+s.clearanceRef);finish('Customs clearance recorded. Coordinate final delivery.')});break;
case 'delivery':if(!s.cleared){toast('Customs clearance is required before delivery.');break}form('Confirm final delivery',`<label>Delivery date<input name="date" type="date" required min="${s.clearanceDate||s.eta}" value="${s.clearanceDate||s.eta}"></label><label>Received by<input name="receiver" required placeholder="Recipient name"></label><label>Proof of delivery reference<input name="pod" required placeholder="Signed delivery note reference"></label><label class="check"><input type="checkbox" required>Goods were delivered to the buyer and receipt was confirmed.</label>`,'Complete shipment',f=>{s.delivered=true;s.pod=f.get('pod');s.deliveryDate=f.get('date');s.receiver=f.get('receiver');s.title='Delivery complete';s.note='Received by '+s.receiver+' · POD '+s.pod;s.action='View completed';s.due=date(s.deliveryDate);s.owner='Complete';log('Delivered to '+s.receiver+' · '+s.pod);finish('Delivery recorded. The shipment journey is complete.')});break;
case 'bl-review':form('Bill of Lading · consistency review',`<p>Check the issued B/L against CI / PL. Sample shipment: ${s.id}.</p><label class="check"><input type="checkbox" required>Shipper, consignee and route match the approved documents.</label><label class="check"><input type="checkbox" required>Goods quantities, packages and gross weight agree with the packing list.</label><label>B/L number<input name="bl" required value="${s.id==='SHP-KW-2404'?'HLCUHAM2412AXTZ7':''}"></label><label>Review evidence<textarea name="note" required placeholder="Record checked values and any exception"></textarea></label>`,'Record B/L review',f=>{s.blReviewed=true;log('B/L '+f.get('bl')+' reviewed: '+f.get('note'));finish('Bill of Lading review recorded')});break;
}}
function bindInputs(){const q=$('#search');if(q)q.oninput=e=>{state.search=e.target.value;const fragment=document.createElement('div');fragment.innerHTML=state.page==='documents'?documents():state.page==='applications'?applications():dashboard();for(const id of ['queue-results','queue-count','document-results']){const old=document.getElementById(id),fresh=fragment.querySelector('#'+id);if(old&&fresh)old.innerHTML=fresh.innerHTML}};const r=$('#review-search');if(r)r.oninput=e=>{state.reviewSearch=e.target.value;const lines=state.lines.filter(l=>(state.reviewFilter==='all'||l.status===state.reviewFilter)&&(!state.reviewSearch||`${l.name} ${l.id} ${l.hs}`.toLowerCase().includes(state.reviewSearch.toLowerCase())));$('#line-results').innerHTML=lineTable(lines)};const af=$('#assignment-form');if(af)af.onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),s=current();s.buyer=f.get('buyer');s.seller=f.get('seller');s.broker=f.get('agent');s.invoice=f.get('invoice');s.origin=f.get('origin');s.from=f.get('port');s.destination=f.get('destination');s.terms=f.get('terms');s.stage=1;s.owner='You';s.title='Review CI / PL consistency';s.note='Application assigned · extraction confirmed';s.action='Review documents';log('Extracted details confirmed and application assigned');render();toast('Assigned to Corseco. Initial consistency review is ready.')}}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.page){state.pipeline=null;navigate(t.dataset.page)}else if(t.dataset.open){close();openShipment(t.dataset.open)}else if(t.dataset.action)action(t.dataset.action,t);else if(t.dataset.filter){state.filter=t.dataset.filter;render()}else if(t.dataset.pipeline!==undefined){state.page='applications';state.filter='all';state.search='';state.pipeline=Number(t.dataset.pipeline);render()}else if(t.dataset.viewstage!==undefined){state.viewStage=Number(t.dataset.viewstage);render()}else if(t.dataset.reviewfilter){state.reviewFilter=t.dataset.reviewfilter;render()}else if(t.dataset.expand){state.expanded=state.expanded===Number(t.dataset.expand)?null:Number(t.dataset.expand);render()}else if(t.dataset.link)linkLine(Number(t.dataset.link));else if(t.dataset.checkdoc!==undefined)checkDocument(Number(t.dataset.checkdoc));else if(t.dataset.thread){state.thread=t.dataset.thread;render()}else if(t.dataset.uploadindex!==undefined){const u=state.uploads[Number(t.dataset.uploadindex)];modal('Uploaded document',`<p><strong>${esc(u.name)}</strong><br>${esc(u.type)} · ${u.id}<br>Provided by ${esc(u.by)}</p><p>Stored in memory for this session. Extraction is not connected; this record has not changed the approved source values.</p><button id="download-file">Download uploaded file</button>`);$('#download-file').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(u.file);a.href=url;a.download=u.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}});
$('#dialog-close').onclick=close;const shade=document.createElement('div');shade.className='mobile-shade';shade.onclick=()=>document.body.classList.remove('menu-open');document.body.append(shade);
window.addEventListener('hashchange',()=>{if(location.hash==='#dashboard')navigate('dashboard')});
// Navigation tools expose exactly the same prototype state as the visible interface.
if(document.modelContext?.registerTool){for(const tool of [{name:'list_shipping_actions',description:'List sample shipment tasks and their owners without changing state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:async()=>({shipments:shipments.map(({id,title,owner,stage})=>({id,nextAction:title,owner,stage:stages[stage]}))})},{name:'open_shipping_application',description:'Open a sample application review. Does not approve or submit any shipment action.',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false},execute:async input=>{if(!input||typeof input.id!=='string'||!shipments.some(s=>s.id===input.id))throw new Error('Unknown application ID');openShipment(input.id);return {opened:input.id}}}]){try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{})}catch{}}}
const initialHash=location.hash.slice(1).split('/');if(initialHash[0]==='detail'&&shipments.some(s=>s.id===initialHash[1])){state.page='detail';state.selected=initialHash[1]}else if(['dashboard','applications','documents','transport','inbox'].includes(initialHash[0]))state.page=initialHash[0];render();
</script></body></html>
